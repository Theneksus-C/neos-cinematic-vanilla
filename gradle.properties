# Memory for the Gradle daemon. The official template uses 1G, raised here
# because decompiling Minecraft sources for reference is memory hungry.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with Gradle's configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Toolchain versions. Verified against https://fabricmc.net/develop on 2026-09-14.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.20

# Mod identity
version=1.5.0
group=io.github.theneksusc

# Dependencies
fabric_api_version=0.160.0+26.2
